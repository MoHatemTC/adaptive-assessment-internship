<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Unified CAT (MCQ + Code + Voice)</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; max-width: 980px; }
    .row { margin: 10px 0; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 14px; margin: 12px 0; }
    .muted { color: #666; font-size: 13px; }
    button { padding: 8px 12px; cursor: pointer; }
    textarea { width: 100%; min-height: 180px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .ok { color: #0a7d24; }
    .warn { color: #9c6a00; }
    .err { color: #b00020; }
    code { background: #f5f5f5; padding: 1px 4px; border-radius: 4px; }
  </style>
</head>
<body>
  <h2>Unified CAT</h2>
  <div class="row muted">One session, dynamic modality switching (<code>mcq</code> / <code>code</code> / <code>open</code>).</div>

  <div class="card">
    <div class="row">
      <label>Target main competencies (comma-separated, optional; empty = all)</label>
      <input id="targets" type="text" style="width:100%" placeholder="C1,C2,C3" />
    </div>
    <div class="row">
      <button id="btnStart">Start CAT Session</button>
      <span id="sessionInfo" class="muted"></span>
    </div>
  </div>

  <div id="status" class="row muted">Waiting to start.</div>
  <div id="presenting" class="card" style="display:none"></div>
  <div id="report" class="card" style="display:none"></div>

  <script src="/static/cat.js"></script>
</body>
</html>
