[pytest]
asyncio_mode = auto
# One rootdir, one suite. The engine and the module's adapters now run in the same process
# in production, so running them in one pytest session is the honest arrangement — the two
# separate rootdirs existed because seven services each owned a different slice of the
# engine and a boundary test is worth nothing in a session that already imported all of
# them. There are no services left to keep apart.
testpaths = cat_engine/tests
# Lock 2 of the judged layer (see cat_engine/evaluation/judged/__init__.py). Judged metrics
# make billed model calls, so the marker is excluded by default and has to be asked for by
# name. Combined with `testpaths` above — which already excludes the package — this means
# an accidental `pytest` cannot spend money even if someone moves the files.
markers =
    deepeval: judged metrics; makes billed LLM calls. Excluded by default.
addopts = -m "not deepeval"
# The module needs no database and no live LLM: every test either runs the deterministic
# path or stubs the model. Placeholders keep Settings satisfied so the suite runs in CI
# with no secrets configured.
#
# These also keep the repository's own `.env` OUT of the suite. `Settings` resolves `.env`
# against the working directory now, and this file's rootdir is the repository root, where
# a developer's real credentials live — an environment variable set here wins over the
# file, which is what stops a local `.env` quietly changing what the suite measures.
env =
    LITELLM_BASE_URL=http://localhost:4000
    LITELLM_API_KEY=placeholder
    LITELLM_MODEL=placeholder-model
    E2B_API_KEY=placeholder
