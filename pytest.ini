[pytest]
asyncio_mode = auto
# One rootdir, one suite. The engine and the module's adapters now run in the same process
# in production, so running them in one pytest session is the honest arrangement — the two
# separate rootdirs existed because seven services each owned a different slice of the
# engine and a boundary test is worth nothing in a session that already imported all of
# them. There are no services left to keep apart.
testpaths = cat_engine/tests
# Nothing here can make a billed model call. The judged-metric layer that could went with
# the simulation harness; what is left stubs the sandbox and the model in `conftest.py`, so
# an accidental `pytest` spends nothing because there is no code path to a paid API.
#
# The module needs no database and no live LLM either: every test runs the deterministic
# path or stubs the model. The placeholders below keep `Settings` satisfied so the suite
# runs in CI with no secrets configured.
#
# These also keep the repository's own `.env` OUT of the suite. `Settings` resolves `.env`
# against the working directory now, and this file's rootdir is the repository root, where
# a developer's real credentials live — an environment variable set here wins over the
# file, which is what stops a local `.env` quietly changing what the suite measures.
#
# THE DATABASE URLS ARE DELIBERATELY NOT SET HERE, and setting them for a whole-suite run is
# a mistake worth knowing about in advance. `BANK_DATABASE_URL` is read when a module is
# built, so with it set in the environment EVERY test resolves banks from Postgres —
# including the ~50 that exist to exercise the file store. They then fail against a store
# they never meant to use, which reads as a broken port and is not one.
#
# The Postgres-gated files skip themselves without a DSN and are run as their own session:
#
#     python -m pytest                                   # everything; file store
#     BANK_DATABASE_URL=postgresql://... SESSION_DATABASE_URL=postgresql://... \
#       python -m pytest cat_engine/tests/test_sql_backed_registry.py \
#                        cat_engine/tests/test_sql_store_parity.py \
#                        cat_engine/tests/test_session_persistence.py
env =
    LITELLM_BASE_URL=http://localhost:4000
    LITELLM_API_KEY=placeholder
    LITELLM_MODEL=placeholder-model
    E2B_API_KEY=placeholder
