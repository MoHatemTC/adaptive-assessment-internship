# The seven services, and what each is allowed to reach.
#
# Build context is the REPOSITORY ROOT so every image can copy the shared packages and the
# engine. The engine is installed as a LIBRARY rather than vendored per service: there is
# one implementation of the psychometrics and several adapters over it, and copying it
# seven times would create seven copies that drift. Which PART of it each service may
# import is not a packaging question — `services/tests/test_services.py` parses every
# import against a declared slice.
#
# `bank-db` is behind the `db` profile and does not start by default; see it below.
name: adaptive-assessment

x-common: &common
  restart: unless-stopped
  environment: &common-env
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    RELEASE: ${RELEASE:-dev}

    # ENGINE POLICY, WHICH MUST BE IDENTICAL EVERYWHERE.
    #
    # These decide what a candidate is SCORED by. Split across services, nothing makes them
    # agree: a grader running CODE_APPROACH=C beside an orchestrator that believes it is B
    # produces a session whose scores were computed one way and whose stopping rule assumed
    # another — internally consistent, entirely wrong, and no request fails.
    #
    # So they are declared once here and every service reports a fingerprint of them on
    # /health. A mismatched pair is a dashboard field rather than a measurement nobody can
    # reproduce.
    ACTIVE_BANK: ${ACTIVE_BANK:-AIE}
    CAT_SE_TARGET: ${CAT_SE_TARGET:-0.55}
    CAT_MAX_QUESTIONS: ${CAT_MAX_QUESTIONS:-12}
    CODE_APPROACH: ${CODE_APPROACH:-B}
    CODE_RUBRIC: ${CODE_RUBRIC:-mid}
    COMPETENCY_GRAPH_ENABLED: ${COMPETENCY_GRAPH_ENABLED:-true}
    GRAPH_UPWARD_INFERENCE_ENABLED: ${GRAPH_UPWARD_INFERENCE_ENABLED:-false}
    GRAPH_DESCENDANT_BLOCKING_ENABLED: ${GRAPH_DESCENDANT_BLOCKING_ENABLED:-false}
    GRAPH_CONVERGENCE_GATE_ENABLED: ${GRAPH_CONVERGENCE_GATE_ENABLED:-true}
  networks: [assessment]

x-litellm: &litellm
  LITELLM_BASE_URL: ${LITELLM_BASE_URL:-}
  LITELLM_API_KEY: ${LITELLM_API_KEY:-}
  LITELLM_MODEL: ${LITELLM_MODEL:-}

services:
  bank-registry:
    <<: *common
    build: {context: .., dockerfile: services/bank-registry/Dockerfile}
    ports: ["8081:8081"]
    # `required: false` so this stays a no-op without `--profile db`: the service starts
    # normally against files, and waits for a healthy database only when one is running.
    depends_on:
      bank-db: {condition: service_healthy, required: false}
    environment:
      <<: *common-env
      # Banks are data, not code. The checked-in ones are mounted read-only, so shipping a
      # correction to one is a deploy of a file; banks posted through the admin API land in
      # a named volume, so registering one is neither a rebuild nor lost on restart.
      ENGINE_DATA_DIR: /srv/seed-data
      BANK_STORE_DIR: /srv/banks
      # Empty keeps the file store. Set by `--profile db`, and only then.
      BANK_DATABASE_URL: ${BANK_DATABASE_URL:-}
      ADMIN_API_ENABLED: ${ADMIN_API_ENABLED:-true}
    volumes:
      - ../backend/app/data:/srv/seed-data:ro
      - posted-banks:/srv/banks

  # OPT-IN. Without `--profile db` this does not start, and both bank services keep
  # resolving banks from files — the default, and the path the whole suite runs against.
  # With it, they load the checked-in banks on boot and read from Postgres instead.
  #
  #     docker compose --profile db up --build
  bank-db:
    <<: *common
    profiles: [db]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adaptive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adaptive}
      POSTGRES_DB: ${POSTGRES_DB:-adaptive}
    volumes:
      - bank-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adaptive} -d ${POSTGRES_DB:-adaptive}"]
      interval: 5s
      timeout: 3s
      retries: 10

  bank-ingest:
    <<: *common
    build: {context: .., dockerfile: services/bank-ingest/Dockerfile}
    ports: ["8084:8084"]
    depends_on:
      bank-db: {condition: service_healthy, required: false}
    environment:
      <<: *common-env
      # THE SAME VOLUME bank-registry reads. One writer, many readers: ingest is an
      # authoring concern with its own security posture, and the registry serves
      # candidate-facing reads on the hot path. Keeping them together is why
      # ADMIN_API_ENABLED had to exist at all.
      ENGINE_DATA_DIR: /srv/seed-data
      BANK_STORE_DIR: /srv/banks
      # Empty keeps the file store. Set by `--profile db`, and only then.
      BANK_DATABASE_URL: ${BANK_DATABASE_URL:-}
      INGEST_API_ENABLED: ${INGEST_API_ENABLED:-true}
      # DERIVATION POLICY. An author uploads questions and never a graph, so one is derived
      # from the items. A sub-to-sub relation at or above the threshold is PREREQUISITE,
      # below it CONTRIBUTES_TO; below the floor, no edge. Derived prerequisite edges ship
      # INERT regardless — co-measurement is weaker evidence than the authored edges that
      # were themselves measured wrong 22.4% of the time against a 3% gate.
      RELATION_THRESHOLD: ${RELATION_THRESHOLD:-0.5}
      EDGE_FLOOR: ${EDGE_FLOOR:-0.05}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
    volumes:
      - ../backend/app/data:/srv/seed-data:ro
      - posted-banks:/srv/banks

  grader:
    <<: *common
    build: {context: .., dockerfile: services/grader/Dockerfile}
    ports: ["8082:8082"]
    depends_on:
      bank-registry: {condition: service_healthy}
    environment:
      # Both anchors in one merge key: YAML allows a LIST of maps here but not two
      # `<<` keys in one mapping, and the second silently winning is exactly the kind of
      # configuration bug that surfaces as a missing API key three services away.
      <<: [*common-env, *litellm]
      BANK_REGISTRY_URL: http://bank-registry:8081
      # A sandbox for untrusted candidate code. Execution happens in E2B, not in this
      # container — nothing here runs a submission.
      E2B_API_KEY: ${E2B_API_KEY:-}

  competency-graph:
    <<: *common
    build: {context: .., dockerfile: services/competency-graph/Dockerfile}
    ports: ["8083:8083"]
    depends_on:
      bank-registry: {condition: service_healthy}
    environment:
      <<: *common-env
      BANK_REGISTRY_URL: http://bank-registry:8081
      # NO EGRESS AT ALL, and no store. It holds no session state, calls no model, and the
      # only thing it reads is a graph. This is the service the security argument is about.

  competency-scope:
    <<: *common
    build: {context: .., dockerfile: services/competency-scope/Dockerfile}
    ports: ["8085:8085"]
    depends_on:
      bank-registry: {condition: service_healthy}
    environment:
      <<: *common-env
      BANK_REGISTRY_URL: http://bank-registry:8081
      # NO EGRESS BEYOND THE REGISTRY, and no store. It reads a graph and a list of item
      # parameters and returns a set of ids. Like competency-graph, it cannot move a
      # posterior: nothing it returns has a score, a weight or an ability estimate in it.

  assessment-orchestrator:
    <<: *common
    build: {context: .., dockerfile: services/assessment-orchestrator/Dockerfile}
    ports: ["8080:8080"]
    depends_on:
      # HEALTHY, not merely started. On a cold database the registry seeds five banks —
      # 1259 items — before it can answer, and an orchestrator that starts first proxies
      # /banks to a service still loading. Compose's default `depends_on` only waits for
      # the container, which is not the same as waiting for the service.
      bank-registry: {condition: service_healthy}
      grader: {condition: service_started}
      competency-graph: {condition: service_started}
      competency-scope: {condition: service_started}
    environment:
      # IT NEEDS MODEL EGRESS, AND ADR-0001 SAID IT WOULD NOT. The Picking Agent calls a
      # model on every queue fill. A network policy written from "the grader is the only
      # component needing egress" makes selection fall back to the deterministic choice on
      # every question — a legitimate degraded mode, and so one that raises no error.
      <<: [*common-env, *litellm]
      BANK_REGISTRY_URL: http://bank-registry:8081
      GRADER_URL: http://grader:8082
      COMPETENCY_GRAPH_URL: http://competency-graph:8083
      # Unset DISABLES competency-scoped assessments rather than widening them to the whole
      # bank. "You asked for three competencies and were assessed on eleven" is not a
      # degraded mode a candidate or a report could detect afterwards.
      COMPETENCY_SCOPE_URL: http://competency-scope:8085
      # WHERE LIVE ASSESSMENTS LIVE. Empty keeps them in this process, which means a restart
      # loses every candidate mid-answer and a second replica cannot serve a session the
      # first one started. Set by `--profile db`. A SEPARATE url from the bank store even
      # against one server: a bank is content that is kept, a session is a record of what a
      # person answered and has a deletion deadline.
      SESSION_DATABASE_URL: ${SESSION_DATABASE_URL:-}
      SESSION_KEEP_RESPONSES: ${SESSION_KEEP_RESPONSES:-false}
      # The instrumented author view: posteriors, selection reasoning, raw session state.
      # NOT candidate-safe. Off unless a deployment deliberately turns it on.
      AUTHOR_DIAGNOSTICS_ENABLED: ${AUTHOR_DIAGNOSTICS_ENABLED:-false}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}

  live-voice:
    <<: *common
    build: {context: .., dockerfile: services/live-voice/Dockerfile}
    # 8765 because that is the port the monolith's helper used, and `/interview` is
    # embedded by URL.
    ports: ["8765:8765"]
    environment:
      # Both anchors in one merge key: YAML allows a LIST of maps here but not two
      # `<<` keys in one mapping, and the second silently winning is exactly the kind of
      # configuration bug that surfaces as a missing API key three services away.
      <<: [*common-env, *litellm]
      LITELLM_LIVE_PREVIEW_MODEL: ${LITELLM_LIVE_PREVIEW_MODEL:-}
      ALLOW_TEXT_FALLBACK: ${ALLOW_TEXT_FALLBACK:-false}
      # Carries transcripts. An operator tool, off unless asked for.
      LIVE_DEBUG_API_ENABLED: ${LIVE_DEBUG_API_ENABLED:-false}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}

volumes:
  # Banks registered through the write path. A volume because they are content: registering
  # one must not be a rebuild, and must survive a restart.
  posted-banks: {}
  # Only used under `--profile db`.
  bank-db: {}

networks:
  assessment: {}
