# The services suite runs SEPARATELY from backend/.
#
# Not a preference: `backend/pytest.ini` sets LITELLM_* and E2B_* placeholders that the
# monolith's Settings requires at import, and the services deliberately share no
# configuration with it. Running both from one rootdir would mean either the services
# inherit the monolith's environment — hiding exactly the coupling this suite exists to
# prove is absent — or the monolith fails to import.
#
#     cd services && python -m pytest      # the seam and the contracts
#     cd backend  && python -m pytest      # the engine and the study harness
[pytest]
testpaths = tests
pythonpath = tests contracts
addopts = -q
