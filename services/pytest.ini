# The services suite runs SEPARATELY from backend/.
#
# Not a preference. Two reasons, and the second is the load-bearing one:
#
#   - `backend/pytest.ini` supplies LITELLM_*/E2B_* placeholders through `pytest-env`, and
#     an engine `Settings` constructed under them is not the one a service sees.
#   - the services import the engine as a LIBRARY and each own a different slice of it.
#     One rootdir would collect `backend/tests` alongside these, and a suite that proves a
#     service imports only its slice is worth nothing if it runs in a session that has
#     already imported all of them.
#
#     cd services && python -m pytest      # the services, the seam and the contracts
#     cd backend  && python -m pytest      # the engine and the study harness
[pytest]
testpaths = tests
pythonpath = tests contracts common clients
addopts = -q
