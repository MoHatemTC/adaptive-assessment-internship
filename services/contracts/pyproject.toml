[project]
name = "adaptive-contracts"
version = "1.0.0"
description = "Wire types shared by every adaptive-assessment service."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["adaptive_contracts*"]
