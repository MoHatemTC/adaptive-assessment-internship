[pytest]
asyncio_mode = auto
testpaths = tests
# Lock 2 of the judged layer (see evaluation/judged/__init__.py). Judged metrics make
# billed model calls, so the marker is excluded by default and has to be asked for by
# name. Combined with `testpaths` above — which already excludes the package — this means
# an accidental `pytest` cannot spend money even if someone moves the files.
markers =
    deepeval: judged metrics; makes billed LLM calls. Excluded by default.
addopts = -m "not deepeval"
# The adaptive engine needs no database and no live LLM: every test either runs the
# deterministic path or stubs the model. Placeholders keep Settings satisfied so the
# suite runs in CI with no secrets configured.
env =
    LITELLM_BASE_URL=http://localhost:4000
    LITELLM_API_KEY=placeholder
    LITELLM_MODEL=placeholder-model
    E2B_API_KEY=placeholder
