[pytest]
asyncio_mode = auto
testpaths = tests
# The adaptive engine needs no database and no live LLM: every test either runs the
# deterministic path or stubs the model. Placeholders keep Settings satisfied so the
# suite runs in CI with no secrets configured.
env =
    LITELLM_BASE_URL=http://localhost:4000
    LITELLM_API_KEY=placeholder
    LITELLM_MODEL=placeholder-model
