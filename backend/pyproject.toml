[project]
# THE ENGINE, AS A LIBRARY.
#
# Every service in `services/` installs this and imports the slice it owns; the evaluation
# harness in `evaluation/` imports it in-process, which is what makes 36,000 simulated
# sessions affordable and is why the modules were NOT cut up and dealt out to the four
# service directories. See docs/adr/0002-engine-as-a-library.md.
#
# The import name stays `app`, so not one import statement in the engine, the harness, the
# scripts or the 672-test suite had to change for this. The services renamed THEIR package
# to `service` instead — there is one engine and four adapters, and the name should say so.
name = "adaptive-engine"
version = "1.0.0"
description = "Adaptive competency assessment engine — 3PL CAT across MCQ, code and open/voice items."
requires-python = ">=3.12"

# Deliberately narrower than requirements.txt. That file is a DEPLOYMENT pin for the whole
# backend; this is what the library itself cannot run without. A service that never grades
# code should not be made to install a sandbox client, so `e2b`, `google-genai`,
# `websockets` and `langfuse` are extras, requested by the service that needs them.
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.0,<3",
    "numpy>=1.26,<3",
    "httpx>=0.27",
    "openai>=1.50,<3",
]

[project.optional-dependencies]
# The code engine's sandbox. grader only.
sandbox = ["e2b-code-interpreter>=2.0,<3"]
# Realtime voice. live-voice only.
live = ["google-genai>=1.0", "websockets>=13"]
# Tracing. Runtime-optional everywhere — `services/observability.py` degrades to no
# tracing when it is absent, unconfigured or broken.
tracing = ["langfuse>=3.0,<5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
# Banks, graphs and rubrics ship with the package so a checkout and a `pip install` see
# the same defaults. A deployment that wants them on a volume sets `ENGINE_DATA_DIR`
# instead of rebuilding the image — see `app/config/paths.py`.
# JSON only. The competency maps that used to sit here are documentation, not data —
# they were being packaged into every wheel and are now in `docs/banks/`.
app = [
    "data/*.json",
    "data/rubrics/*.json",
    "data/voice_rubrics/*.json",
]
